<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ultraspeaker Flipbook Lab</title>
<meta name="description" content="Trasforma un PDF in un flipbook: sfoglialo, sottolinealo e registra un video con sfondo trasparente per Keynote o con il colore della slide per PowerPoint.">
<link rel="icon" href="assets/flipbook-lab-icon-64.png">
<style>
/* Brand Book 1.0: Champagne & Limousines in quattro stili (Regular, Italic, Bold, Bold Italic) */
@font-face{font-family:"Champagne & Limousines";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/champagne-limousines-regular.woff2) format("woff2")}
@font-face{font-family:"Champagne & Limousines";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/champagne-limousines-bold.woff2) format("woff2")}
@font-face{font-family:"Champagne & Limousines";font-weight:400;font-style:italic;font-display:swap;src:url(fonts/champagne-limousines-italic.woff2) format("woff2")}
@font-face{font-family:"Champagne & Limousines";font-weight:700;font-style:italic;font-display:swap;src:url(fonts/champagne-limousines-bolditalic.woff2) format("woff2")}
:root{
  /* palette del Brand Book: Stage Black, Backstage, Curtain, Graphite, Ash, Silver, House Lights, Spotlight */
  --bg:#000000; --surface:#111111; --surface-2:#111111; --surface-3:#1B1B1B; --ink:#FFFFFF; --ink-2:#D0D0D0; --ink-3:#8E8E8E;
  --line:#1B1B1B; --line-2:#1B1B1B; --line-3:#3A3A3A; --paper:#F3F3F3;
  /* colori funzionali, solo nell'interfaccia: ambra per gli avvisi, blu per il focus */
  --warn:#FFCF80; --focus:#4F8DFF; --radius:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 "Champagne & Limousines","Avenir Next","Segoe UI",-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}

/* ---------- Intestazione ---------- */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);min-width:0}
.top .lockup{width:168px;height:auto;flex:none;display:block}
.top .arena{display:none;width:34px;height:auto}
.brandlink{display:inline-flex;flex:none;border-radius:6px;transition:opacity .15s}
.brandlink:hover{opacity:.75}
.brandlink:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.empty .brandlink{width:min(360px,60%);justify-content:center}
.empty .brandlink img{width:100%}
.doc{min-width:0;display:flex;flex-direction:column;line-height:1.25;margin-left:6px;padding-left:14px;border-left:1px solid var(--line-2)}
.doc b{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc span{font-size:11px;color:var(--ink-3)}
.spacer{flex:1}
.btn{height:36px;padding:0 14px;border-radius:var(--radius);font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid var(--line-3);background:transparent;color:#FFFFFF}
.btn.pri{background:#FFFFFF;color:#000000;border-color:#FFFFFF}
.btn.rec{background:#FFFFFF;border-color:#FFFFFF;color:#000000}
.btn.big{height:44px;padding:0 20px;font-size:15px;border-radius:var(--radius)}
.lang{display:flex;align-items:center;gap:6px}
.lang svg{width:15px;height:15px;stroke:#8E8E8E;fill:none;stroke-width:1.8}
select{height:32px;padding:0 6px;border-radius:var(--radius);background:#111111;border:1px solid #3A3A3A;font-size:13px;font-weight:700}
.recpill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:var(--radius);background:rgba(255,207,128,.12);border:1px solid var(--warn);color:var(--warn);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.recpill i{width:9px;height:9px;border-radius:50%;background:var(--warn);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- Area di lavoro ---------- */
.work{position:relative;display:grid;grid-template-columns:auto 1fr;min-height:0}
.tools{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border-right:1px solid var(--line);overflow:auto}
.tool{width:42px;height:42px;border-radius:var(--radius);border:1px solid transparent;background:transparent;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;position:relative}
.tool:hover{background:var(--surface-3)}
.tool[aria-pressed="true"]{background:#FFFFFF;color:#000000}
.tool svg{width:20px;height:20px}
.tool .k{position:absolute;right:3px;bottom:1px;font-size:8.5px;font-weight:700;opacity:.55}
.tsep{width:26px;height:1px;background:var(--line-2);margin:4px 0;flex:none}
.dots{display:grid;grid-template-columns:repeat(2,18px);gap:7px;padding:4px 0}
.dot{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.25);padding:0}
.dot[aria-pressed="true"]{outline:2px solid #FFFFFF;outline-offset:2px}
.mode{display:flex;flex-direction:column;gap:4px;padding:3px;border-radius:var(--radius);background:var(--surface-2);border:1px solid var(--line-2)}
.mode .tool{width:36px;height:34px;border-radius:7px}

.stagewrap{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px}
.stage{position:relative;flex:none;width:320px;height:180px;border-radius:var(--radius);overflow:hidden;outline:1px solid var(--line-2)}
.stagewrap:fullscreen{padding:0;background:#000000}
.stagewrap:-webkit-full-screen{padding:0;background:#000000;width:100%;height:100%}
.stagewrap:fullscreen .stage{border-radius:0;outline:0}
.stage.checker{background:repeating-conic-gradient(#1B1B1B 0 25%,#111111 0 50%) 0 0/22px 22px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.stage.recording{outline:2px solid var(--warn)}
.stagenote{position:absolute;left:10px;top:8px;font-size:10px;font-weight:700;letter-spacing:.32em;color:rgba(255,255,255,.45);pointer-events:none;text-transform:uppercase}
.stage.light .stagenote{color:rgba(0,0,0,.4)}

/* stato vuoto */
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px;background:#000000}
.empty img{width:min(360px,60%);height:auto}
.empty h1{margin:6px 0 0;font-size:clamp(18px,2.4vw,24px);font-weight:700;line-height:1.2;text-wrap:balance}
.empty p{margin:0;color:var(--ink-2);max-width:520px;font-size:14.5px;line-height:1.6}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 28px;border:2px dashed #3A3A3A;border-radius:var(--radius);transition:border-color .15s,background .15s}
.dropzone svg{width:26px;height:26px;color:var(--ink-3)}
.dropzone b{font-size:14px;color:var(--ink-2)}
.dropzone.over{border-color:#FFFFFF;background:rgba(255,255,255,.05)}
.busy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.88);z-index:5}
.busy img{width:90px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.bar{width:min(320px,70%);height:4px;border-radius:2px;background:#3A3A3A;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#FFFFFF;transition:width .15s}

/* ---------- Barra in basso ---------- */
.bottom{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.nav{display:flex;align-items:center;gap:2px;padding:3px;border-radius:var(--radius);background:var(--surface-2);border:1px solid var(--line-2)}
.nav button{width:34px;height:32px;border-radius:7px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:#FFFFFF}
.nav button:hover:not(:disabled){background:var(--surface-3)}
.num{min-width:78px;text-align:center;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
.seg{display:inline-grid;grid-auto-flow:column;gap:3px;padding:3px;border-radius:var(--radius);background:var(--surface-2);border:1px solid var(--line-2)}
.seg button{height:30px;border-radius:7px;border:0;background:transparent;color:var(--ink-2);font-size:13px;font-weight:700;padding:0 11px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:#FFFFFF;color:#000000}
.seg svg{width:16px;height:16px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.32em;color:var(--ink-3);text-transform:uppercase}
.grp{display:flex;align-items:center;gap:8px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink-2);cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;width:32px;height:18px;border-radius:9px;background:#3A3A3A;position:relative;margin:0;cursor:pointer}
.chk input::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#D0D0D0;transition:transform .15s}
.chk input:checked{background:#FFFFFF}
.chk input:checked::after{transform:translateX(14px);background:#000000}
.swatch{position:relative;width:30px;height:30px;border-radius:var(--radius);border:1px solid #3A3A3A;overflow:hidden;cursor:pointer;display:inline-block}
.swatch input{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);opacity:0;cursor:pointer}
.imgsw{padding:0;background:#1B1B1B center/cover no-repeat}
.checkicon{background:repeating-conic-gradient(#8E8E8E 0 25%,#D0D0D0 0 50%) 0 0/8px 8px;width:14px;height:14px;border-radius:3px;display:inline-block}

/* ---------- Finestre ---------- */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{width:min(560px,100%);max-height:100%;overflow:auto;background:#111111;border:1px solid #3A3A3A;border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:16px}
.dlg h2{margin:0;font-size:20px;font-weight:700;line-height:1.2}
.dlg .sub{margin:-8px 0 0;color:var(--ink-2);font-size:14px;line-height:1.6}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{text-align:left;padding:14px;border-radius:var(--radius);border:1px solid var(--line-3);background:#000000;display:flex;flex-direction:column;gap:6px;color:#FFFFFF}
.card[aria-pressed="true"]{border-color:#FFFFFF;background:#1B1B1B;outline:1px solid #FFFFFF}
.card b{font-size:15.5px}
.card span{font-size:13px;color:var(--ink-2);line-height:1.5}
.card .tag{align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.32em;padding:3px 7px;border-radius:5px;background:#1B1B1B;color:var(--ink-2)}
.card .prev{height:46px;border-radius:7px;display:flex;align-items:center;justify-content:center;border:1px solid #1B1B1B}
.card .prev i{width:44px;height:30px;border-radius:3px;background:linear-gradient(90deg,#F3F3F3 49%,#8E8E8E 50%,#F3F3F3 51%)}
.checker2{background:repeating-conic-gradient(#3A3A3A 0 25%,#1B1B1B 0 50%) 0 0/12px 12px}
.opts{display:flex;flex-direction:column;gap:10px}
.optrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.optrow .lbl{min-width:96px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{height:30px;padding:0 11px;border-radius:var(--radius);border:1px solid #3A3A3A;background:var(--surface-2);color:var(--ink-2);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:#FFFFFF;color:#000000;background:#FFFFFF}
.note{margin:0;font-size:13px;line-height:1.6;color:var(--ink-3)}
.hint{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink-2);background:#000000;border:1px solid #3A3A3A;border-radius:var(--radius);padding:10px 12px}
.acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#expDl{text-decoration:none}
.url-in{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:12px 14px;border-radius:var(--radius);border:1px solid var(--line-3);background:var(--surface-2);color:var(--ink)}
.url-in:focus{outline:2px solid var(--focus);outline-offset:1px}
@media (max-width:640px){#expDlg .acts{flex-direction:column;align-items:stretch}#expDlg .acts .btn{width:100%;justify-content:center}#expGo,#expShare{order:1}#expDl{order:2}#expSaveAs{order:3}#expOther{order:4}#expCancel{order:5}}
.num-in{width:64px;height:32px;border-radius:var(--radius);border:1px solid #3A3A3A;background:#000000;padding:0 8px;font-weight:700;font-variant-numeric:tabular-nums}
.done{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.done video{width:100%;max-height:220px;border-radius:var(--radius);background:repeating-conic-gradient(#1B1B1B 0 25%,#111111 0 50%) 0 0/16px 16px}

.drop{position:fixed;inset:10px;z-index:40;border:2px dashed #FFFFFF;border-radius:var(--radius);background:rgba(0,0,0,.84);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:16px;font-weight:700;pointer-events:none}
.drop img{width:96px}
.toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-10px);background:#FFFFFF;color:#000000;font-weight:700;font-size:14px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px);text-align:center;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--warn);color:#000000}

@media (max-width:1500px){.hide-m{display:none!important}}
@media (max-width:760px){
  .top .lockup{width:160px}
  .doc{display:none}
  .work{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .tools{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;overflow-x:auto}
  .tsep{width:1px;height:26px;margin:0 4px}
  .mode{flex-direction:row}
  .dots{grid-template-columns:repeat(6,18px)}
  .stagewrap{padding:10px}
  .cards{grid-template-columns:1fr}
  .hide-s{display:none!important}
  /* schermata iniziale: usa tutto lo spazio (non solo il riquadro 16:9 del libro) e scorre se serve */
  .stagewrap:has(.empty:not([hidden])) .stage{width:100%!important;height:100%!important}
  .empty{justify-content:safe center;overflow-y:auto;gap:10px;padding:18px 16px}
  .empty .brandlink{width:min(220px,62%)}
  .empty h1{font-size:17px;margin:2px 0 0}
  .empty p{font-size:14px;line-height:1.5;color:var(--ink-2)}
  .dropzone{padding:14px 12px;gap:10px;width:100%;max-width:420px}
  .row .btn.big{flex:1 1 auto}
  /* finché non c'è un PDF i comandi in basso non servono: sul telefono lasciano spazio alla pagina iniziale */
  .app:has(.empty:not([hidden])) .bottom{display:none}
}
/* sul telefono non si trascinano file: riquadro senza tratteggio e senza «Trascina qui» */
@media (pointer:coarse){.dropzone{border:0;padding:4px 0}.dropzone > svg,.dropzone > b{display:none}}
@media (max-width:480px){.top .lockup{display:none}.top .arena{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brandlink" href="https://www.theultraspeaker.com" target="_blank" rel="noopener" title="theultraspeaker.com"><img class="lockup" src="assets/logo-flipbook-lab-white.svg" alt="The Ultraspeaker Flipbook Lab – theultraspeaker.com"><img class="arena" src="assets/arena.svg" alt="The Ultraspeaker – theultraspeaker.com"></a>
    <div class="doc" id="doc" hidden><b id="docName"></b><span id="docInfo"></span></div>
    <div class="spacer"></div>
    <span class="recpill" id="recPill" hidden><i></i><span id="recTime">00:00</span></span>
    <button type="button" class="btn" id="openBtn">
      <svg class="i" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 17v-6M9 14l3-3 3 3"/></svg>
      <span data-i18n="open"></span>
    </button>
    <button type="button" class="btn" id="linkBtn" data-i18n-title="l.open" data-i18n-aria="l.open">
      <svg class="i" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></svg>
      <span class="hide-s" data-i18n="l.short"></span>
    </button>
    <label class="lang hide-s">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <select id="lang" data-i18n-aria="lang"></select>
    </label>
  </header>

  <div class="work">
    <nav class="tools" id="tools" data-i18n-aria="tools">
      <button type="button" class="tool" data-tool="hand"><svg viewBox="0 0 24 24" class="i"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11.5v-7a1.5 1.5 0 0 1 3 0V12M14 11.5v-5a1.5 1.5 0 0 1 3 0V13M17 9.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-2a6 6 0 0 1-4.9-2.6L4.3 14.3a1.6 1.6 0 0 1 2.5-2L8 14"/></svg><span class="k">H</span></button>
      <button type="button" class="tool" data-tool="hl"><svg viewBox="0 0 24 24" class="i"><path d="M9 11l-5 5v3h3l5-5M9 11l4-4 5 5-4 4M9 11l5 5M13 7l2-2a2 2 0 0 1 2.8 0L19 6.2a2 2 0 0 1 0 2.8l-2 2"/><path d="M3 22h8" stroke-width="3"/></svg><span class="k">E</span></button>
      <button type="button" class="tool" data-tool="ul"><svg viewBox="0 0 24 24" class="i"><path d="M7 4v6a5 5 0 0 0 10 0V4M5 20h14"/></svg><span class="k">U</span></button>
      <button type="button" class="tool" data-tool="pen"><svg viewBox="0 0 24 24" class="i"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span class="k">P</span></button>
      <button type="button" class="tool" data-tool="erase"><svg viewBox="0 0 24 24" class="i"><path d="M20 20H9L4 15a2 2 0 0 1 0-2.8L13.2 3a2 2 0 0 1 2.8 0L21 8a2 2 0 0 1 0 2.8L12 20M7.5 9.5l7 7"/></svg><span class="k">G</span></button>
      <button type="button" class="tool" data-tool="zoom"><svg viewBox="0 0 24 24" class="i"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M10.5 7.5v6M7.5 10.5h6"/></svg><span class="k">Z</span></button>
      <button type="button" class="tool" data-tool="zoomout"><svg viewBox="0 0 24 24" class="i"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M7.5 10.5h6"/></svg><span class="k">⇧Z</span></button>
      <div class="tsep"></div>
      <div class="mode" role="group" data-i18n-aria="markMode">
        <button type="button" class="tool" data-mode="keep"><svg viewBox="0 0 24 24" class="i"><path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></svg></button>
        <button type="button" class="tool" data-mode="fade"><svg viewBox="0 0 24 24" class="i"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg></button>
      </div>
      <div class="tsep"></div>
      <div class="dots" id="dots"></div>
      <div class="tsep"></div>
      <button type="button" class="tool" id="clearBtn"><svg viewBox="0 0 24 24" class="i"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-13M9 7V4h6v3"/></svg></button>
    </nav>

    <div class="stagewrap" id="stagewrap">
      <div class="stage checker" id="stage">
        <canvas id="cv"></canvas>
        <div class="stagenote" id="stagenote"></div>
        <section class="empty" id="empty" hidden>
          <a class="brandlink" href="https://www.theultraspeaker.com" target="_blank" rel="noopener" title="theultraspeaker.com"><img src="assets/logo-flipbook-lab-white.svg" alt="The Ultraspeaker Flipbook Lab – theultraspeaker.com"></a>
          <h1 data-i18n="empty.title"></h1>
          <p data-i18n="empty.text"></p>
          <div class="dropzone" id="dropzone">
            <svg class="i" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
            <b data-i18n="dropBox"></b>
            <div class="row">
              <button type="button" class="btn pri big" id="chooseBtn"><span data-i18n="choose"></span></button>
              <button type="button" class="btn big" id="linkBtn2" data-i18n="l.fromLink"></button>
              <button type="button" class="btn big" id="sampleBtn" data-i18n="sample"></button>
            </div>
          </div>
        </section>
        <section class="busy" id="busy" hidden>
          <img src="assets/flipbook-logetto.svg" alt="">
          <div id="busyText"></div>
          <div class="bar"><i id="busyBar"></i></div>
        </section>
      </div>
    </div>
  </div>

  <footer class="bottom">
    <div class="nav">
      <button type="button" id="firstBtn" data-i18n-aria="first" data-i18n-title="first"><svg class="i" viewBox="0 0 24 24"><path d="M18 5l-7 7 7 7M7 5v14"/></svg></button>
      <button type="button" id="prevBtn" data-i18n-aria="prev" data-i18n-title="prev"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="num" id="num">–</div>
      <button type="button" id="nextBtn" data-i18n-aria="next" data-i18n-title="next"><svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="nav" id="zoomGrp">
      <button type="button" id="zoomOut" data-i18n-aria="zoomOut" data-i18n-title="zoomOut"><svg class="i" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      <button type="button" class="num" id="zoomPct" style="min-width:58px;width:auto" data-i18n-title="zoomReset">100%</button>
      <button type="button" id="zoomIn" data-i18n-aria="zoomIn" data-i18n-title="zoomIn"><svg class="i" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
    </div>
    <div class="grp">
      <div class="seg" id="segLayout">
        <button type="button" data-v="book" data-i18n-title="l.book"><svg class="i" viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-1.6V19c3-.4 6 .1 8 1.6 2-1.5 5-2 8-1.6V4.4C17 4 14 4.5 12 6zM12 6v14.6"/></svg><span class="hide-s hide-m" data-i18n="l.book"></span></button>
        <button type="button" data-v="single" data-i18n-title="l.single"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span class="hide-s hide-m" data-i18n="l.single"></span></button>
      </div>
      <label class="chk" id="coverWrap" data-i18n-title="cover"><input type="checkbox" id="optCover"><span class="hide-s hide-m" data-i18n="cover"></span></label>
    </div>
    <div class="grp">
      <span class="lbl hide-s hide-m" data-i18n="bg"></span>
      <div class="seg" id="segBg">
        <button type="button" data-v="clear"><i class="checkicon"></i><span data-i18n="bg.clear"></span></button>
        <button type="button" data-v="color"><i class="checkicon" id="bgChip" style="background:#000000"></i><span data-i18n="bg.color"></span></button>
        <button type="button" data-v="image"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg><span data-i18n="bg.image"></span></button>
      </div>
      <label class="swatch" id="bgSwatch" data-i18n-title="bg.pick"><input type="color" id="bgColor" value="#000000"></label>
      <button type="button" class="swatch imgsw" id="bgImgBtn" data-i18n-title="bg.imagePick" hidden></button>
      <input type="file" id="bgFile" accept="image/*" hidden>
    </div>
    <div class="spacer"></div>
    <button type="button" class="btn hide-s" id="fsBtn" data-i18n-title="full"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button type="button" class="btn" id="autoBtn"><svg class="i" viewBox="0 0 24 24"><path d="M5 4l10 8-10 8zM19 5v14"/></svg><span data-i18n="auto"></span></button>
    <button type="button" class="btn rec" id="recBtn"><svg class="i" viewBox="0 0 24 24" id="recIco"><circle cx="12" cy="12" r="6" fill="currentColor" stroke="none"/></svg><span id="recLabel"></span></button>
  </footer>
</div>

<!-- Registrazione automatica -->
<div class="veil" id="autoDlg" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="autoTitle">
    <h2 id="autoTitle" data-i18n="a.title"></h2>
    <p class="sub" data-i18n="a.sub"></p>
    <div class="opts">
      <div class="optrow"><span class="lbl" data-i18n="a.pages"></span>
        <input class="num-in" type="number" id="aFrom" min="1" value="1"> <span>–</span> <input class="num-in" type="number" id="aTo" min="1" value="1">
      </div>
      <div class="optrow"><span class="lbl" data-i18n="a.hold"></span><div class="chips" id="aHold"></div></div>
      <div class="optrow"><span class="lbl" data-i18n="a.speed"></span><div class="chips" id="aSpeed"></div></div>
      <div class="optrow"><span class="lbl" data-i18n="a.marks"></span>
        <div class="seg" id="aMarks">
          <button type="button" data-v="draw" data-i18n="a.marksDraw"></button>
          <button type="button" data-v="show" data-i18n="a.marksShow"></button>
        </div>
      </div>
      <div class="optrow" id="aAfterRow"><span class="lbl" data-i18n="a.after"></span><div class="chips" id="aAfter"></div></div>
      <p class="hint" id="aMarksInfo"></p>
      <label class="chk"><input type="checkbox" id="aClose"><span data-i18n="a.close"></span></label>
    </div>
    <p class="note" id="aInfo"></p>
    <div class="acts">
      <button type="button" class="btn" data-close data-i18n="cancel"></button>
      <button type="button" class="btn pri" id="aGo" data-i18n="a.go"></button>
    </div>
  </div>
</div>

<!-- Esportazione -->
<div class="veil" id="expDlg" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="expTitle">
    <h2 id="expTitle" data-i18n="x.title"></h2>
    <p class="sub" id="expSub"></p>
    <div id="expForm" class="opts">
      <div class="cards">
        <button type="button" class="card" data-fmt="mov">
          <div class="prev checker2"><i></i></div>
          <span class="tag">KEYNOTE</span>
          <b data-i18n="x.mov"></b>
          <span data-i18n="x.movText"></span>
        </button>
        <button type="button" class="card" data-fmt="mp4">
          <div class="prev" id="mp4Prev" style="background:#000000"><i></i></div>
          <span class="tag">POWERPOINT</span>
          <b data-i18n="x.mp4"></b>
          <span data-i18n="x.mp4Text"></span>
        </button>
      </div>
      <div class="optrow" id="mp4ColorRow"><span class="lbl" data-i18n="bg"></span>
        <div class="seg" id="mp4Bg">
          <button type="button" data-v="color" data-i18n="bg.color"></button>
          <button type="button" data-v="image" data-i18n="bg.image"></button>
        </div>
        <label class="swatch" id="mp4Sw"><input type="color" id="mp4Color" value="#000000"></label>
        <span class="note" id="mp4BgNote"></span>
      </div>
      <div class="optrow"><span class="lbl" data-i18n="x.res"></span><div class="chips" id="resChips"></div></div>
      <p class="note" id="expNote"></p>
    </div>
    <div id="expRun" class="opts" hidden>
      <div id="expPhase"></div>
      <div class="bar" style="width:100%"><i id="expBar"></i></div>
      <p class="note" data-i18n="x.keepOpen"></p>
    </div>
    <div id="expDone" class="done" hidden>
      <video id="expVideo" controls muted playsinline></video>
      <div><b id="expFile"></b> <span class="note" id="expSize"></span></div>
      <p class="note" id="expWhere" hidden></p>
      <p class="hint" id="expHow"></p>
    </div>
    <div class="acts">
      <button type="button" class="btn" id="expCancel" data-i18n="cancel"></button>
      <button type="button" class="btn" id="expOther" hidden></button>
      <button type="button" class="btn pri" id="expGo" data-i18n="x.go"></button>
      <button type="button" class="btn pri" id="expShare" hidden><svg class="i" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M6 12H5v8h14v-8h-1"/></svg><span data-i18n="x.share"></span></button>
      <button type="button" class="btn" id="expSaveAs" hidden><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13l3 3 3-3"/></svg><span data-i18n="x.saveAs"></span></button>
      <a class="btn pri" id="expDl" hidden download><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span data-i18n="x.download"></span></a>
    </div>
  </div>
</div>

<div class="veil" id="linkDlg" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="linkTitle">
    <h2 id="linkTitle" data-i18n="l.title"></h2>
    <p class="sub" data-i18n="l.sub"></p>
    <form class="opts" id="linkForm" autocomplete="off">
      <input class="url-in" type="url" id="linkUrl" inputmode="url" spellcheck="false" placeholder="https://…" required>
      <p class="hint" data-i18n="l.hint"></p>
    </form>
    <div class="acts">
      <button type="button" class="btn" id="linkCancel" data-i18n="cancel"></button>
      <button type="submit" form="linkForm" class="btn pri" id="linkGo" data-i18n="l.go"></button>
    </div>
  </div>
</div>

<input type="file" id="fileIn" accept="application/pdf,.pdf" hidden>
<div class="drop" id="drop" hidden><img src="assets/flipbook-logetto.svg" alt=""><span data-i18n="dropHere"></span></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/mp4-muxer.js"></script>
<script src="vendor/ffmpeg/ffmpeg.js"></script>
<script src="js/i18n.js"></script>
<script src="js/engine.js"></script>
<script src="js/annot.js"></script>
<script src="js/pages.js"></script>
<script src="js/store.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
